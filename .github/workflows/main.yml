name: Auto Render Android Tricks Video

on:
  repository_dispatch:
    types: [render_and_upload]

# 👇 YEH BLOCK ADD KIYA GAYA HAI (Releases create karne ki permission) 👇
permissions:
  contents: write

jobs:
  build_video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Extra Swap Space (OOM Crash Fix)
        run: |
          sudo fallocate -l 8G /swapfile-extra
          sudo chmod 600 /swapfile-extra
          sudo mkswap /swapfile-extra
          sudo swapon /swapfile-extra
          free -h

      - name: Install System Dependencies (FFmpeg & ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-deva fonts-indic
          # ImageMagick policy fix so MoviePy can generate TextClips without error
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # Pillow==9.5.0 is critical to avoid ANTIALIAS attribute errors in MoviePy
          pip install moviepy==1.0.3 requests edge-tts urllib3 Pillow==9.5.0

      - name: Verify Python Script Exists
        run: ls -la

      - name: Run Video Rendering Script
        env:
          FULL_TEXT: ${{ github.event.client_payload.full_text }}
          SCENES_DATA: ${{ github.event.client_payload.scenes_data }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          THUMBNAIL_PROMPT: ${{ github.event.client_payload.thumbnail_prompt }}
          RESUME_URL: ${{ github.event.client_payload.resume_url }}
          
          # 👇 YAHAN SMART FALLBACK KEYWORDS ADD KIYA GAYA HAI 👇
          FALLBACK_KEYWORDS: ${{ github.event.client_payload.fallback_keywords }}
          
          # 🔥 FIX: Yahan Title aur Description map kar diye gaye hain 🔥
          TITLE: ${{ github.event.client_payload.title }}
          DESCRIPTION: ${{ github.event.client_payload.description }}
          TELEGRAM_BOT_TOKEN: "8606637548:AAFP7W0koQcXtK1cHNS9pSOorojvSq4fRTg"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }} 
          # 👇 YEH LINE ADD KI GAYI HAI 👇
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python render_video.py

      # 👇 NAYA AUTO-DELETE BLOCK YAHAN HAI 👇
      - name: Auto-delete older releases safely
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releases = await github.rest.repos.listReleases({ owner, repo, per_page: 50 });
            
            // Keep the 3 most recent releases
            const toDelete = releases.data.slice(3);
            for (const release of toDelete) {
              console.log(`Deleting release: ${release.tag_name}`);
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `tags/${release.tag_name}` });
              } catch (e) {
                console.log(`Tag ${release.tag_name} already deleted.`);
              }
            }
