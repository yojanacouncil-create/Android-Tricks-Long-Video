name: Auto Render Android Tricks Video

on:
  repository_dispatch:
    types: [render_and_upload]

# 👇 YEH BLOCK ADD KIYA GAYA HAI (Releases create karne ki permission) 👇
permissions:
  contents: write

jobs:
  build_video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Extra Swap Space (OOM Crash Fix)
        run: |
          sudo fallocate -l 8G /swapfile-extra
          sudo chmod 600 /swapfile-extra
          sudo mkswap /swapfile-extra
          sudo swapon /swapfile-extra
          free -h

      - name: Install System Dependencies (FFmpeg & ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-deva fonts-indic
          # ImageMagick policy fix so MoviePy can generate TextClips without error
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # Pillow==9.5.0 is critical to avoid ANTIALIAS attribute errors in MoviePy
          pip install moviepy==1.0.3 requests edge-tts urllib3 Pillow==9.5.0

      - name: Run Video Rendering Script
        env:
          FULL_TEXT: ${{ github.event.client_payload.full_text }}
          SCENES_DATA: ${{ github.event.client_payload.scenes_data }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          THUMBNAIL_PROMPT: ${{ github.event.client_payload.thumbnail_prompt }}
          RESUME_URL: ${{ github.event.client_payload.resume_url }}
          # 🔥 FIX: Yahan Title aur Description map kar diye gaye hain 🔥
          TITLE: ${{ github.event.client_payload.title }}
          DESCRIPTION: ${{ github.event.client_payload.description }}
          TELEGRAM_BOT_TOKEN: "8606637548:AAFP7W0koQcXtK1cHNS9pSOorojvSq4fRTg"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }} 
          # 👇 YEH LINE ADD KI GAYI HAI 👇
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python render_video.py
